<table><thead><tr><th style="text-align:left;">SYMBOL</th><th>PRICE</th><th>CHG</th><th>CHG%</th><th></th></tr></thead><tbody>
{% for q in quotes %}<tr>
<td style="text-align:left;"><span style="color:var(--amber);font-weight:bold;cursor:pointer;" hx-get="/stocks/quote?symbol={{ q.symbol }}" hx-target="#stock-panel" hx-swap="innerHTML">{{ q.symbol }}</span></td>
<td>{{ "{:,.2f}".format(q.price) }}</td>
<td class="{{ 'up' if q.change >= 0 else 'down' }}">{{ "+" if q.change >= 0 else "" }}{{ "{:.2f}".format(q.change) }}</td>
<td class="{{ 'up' if q.change_pct >= 0 else 'down' }}">{{ "+" if q.change_pct >= 0 else "" }}{{ "{:.2f}".format(q.change_pct) }}%</td>
<td><form style="margin:0;display:inline;" hx-post="/watchlist/remove" hx-target="#watchlist-panel" hx-swap="innerHTML"><input type="hidden" name="symbol" value="{{ q.symbol }}"><button type="submit" class="btn-remove" style="padding:2px 5px;font-size:9px;">X</button></form></td>
</tr>{% endfor %}
</tbody></table>
<form class="add-form" hx-post="/watchlist/add" hx-target="#watchlist-panel" hx-swap="innerHTML" style="margin-top:8px;">
<div class="form-group" style="flex:1;"><label>ADD SYMBOL</label><input type="text" name="symbol" placeholder="e.g. META" style="text-transform:uppercase;width:100%;"></div>
<button type="submit" style="margin-top:14px;">ADD</button></form>
