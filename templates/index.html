{% extends "base.html" %}
{% block content %}
<div class="terminal-grid">
    <div class="terminal-col">
        <div class="panel" style="flex: 0 0 auto;">
            <div class="panel-header"><span class="panel-title">&#9670; MARKET OVERVIEW</span><span id="ind-market" class="htmx-indicator timestamp">LOADING...</span></div>
            <div class="panel-body" hx-get="/market/overview" hx-trigger="load, every 30s" hx-target="this" hx-swap="innerHTML" hx-indicator="#ind-market"></div>
        </div>
        <div class="panel" style="flex: 1;">
            <div class="panel-header"><span class="panel-title">&#9670; WATCHLIST</span><span id="ind-watchlist" class="htmx-indicator timestamp">LOADING...</span></div>
            <div class="panel-body" id="watchlist-panel" hx-get="/watchlist" hx-trigger="load, every 30s" hx-target="this" hx-swap="innerHTML" hx-indicator="#ind-watchlist"></div>
        </div>
    </div>
    <div class="terminal-col">
        <div class="panel" style="flex: 1;">
            <div class="panel-header"><span class="panel-title">&#9670; EQUITY QUOTE</span><span id="ind-stock" class="htmx-indicator timestamp">LOADING...</span></div>
            <div class="panel-body" style="overflow-y: auto;">
                <div class="search-bar">
                    <input type="text" id="symbol-input" name="symbol" placeholder="ENTER SYMBOL (e.g. AAPL)" value="AAPL" style="text-transform: uppercase;"
                           hx-get="/stocks/quote" hx-trigger="keyup[keyCode==13]" hx-target="#stock-panel" hx-swap="innerHTML" hx-include="#symbol-input" hx-indicator="#ind-stock">
                    <button hx-get="/stocks/quote" hx-target="#stock-panel" hx-swap="innerHTML" hx-include="#symbol-input" hx-indicator="#ind-stock">GO</button>
                </div>
                <div id="stock-panel" hx-get="/stocks/quote?symbol=AAPL" hx-trigger="load" hx-swap="innerHTML" hx-indicator="#ind-stock"></div>
            </div>
        </div>
        <div class="panel" style="flex: 0 0 240px;">
            <div class="panel-header"><span class="panel-title">&#9670; MARKET NEWS</span><span id="ind-news" class="htmx-indicator timestamp">LOADING...</span></div>
            <div class="panel-body" hx-get="/news/feed" hx-trigger="load, every 300s" hx-target="this" hx-swap="innerHTML" hx-indicator="#ind-news"></div>
        </div>
    </div>
    <div class="terminal-col">
        <div class="panel" style="flex: 0 0 auto;">
            <div class="panel-header"><span class="panel-title">&#9670; FOREX / FX RATES</span><span id="ind-forex" class="htmx-indicator timestamp">LOADING...</span></div>
            <div class="panel-body" hx-get="/forex/rates" hx-trigger="load, every 30s" hx-target="this" hx-swap="innerHTML" hx-indicator="#ind-forex"></div>
        </div>
        <div class="panel" style="flex: 1;">
            <div class="panel-header"><span class="panel-title">&#9670; PORTFOLIO</span><span id="ind-portfolio" class="htmx-indicator timestamp">LOADING...</span></div>
            <div class="panel-body" id="portfolio-panel" hx-get="/portfolio" hx-trigger="load, every 30s" hx-target="this" hx-swap="innerHTML" hx-indicator="#ind-portfolio"></div>
        </div>
    </div>
</div>
{% endblock %}
