<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bloomberg Terminal</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/terminal.css">
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    <script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
</head>
<body>
    <nav class="terminal-nav">
        <span class="terminal-title">&#9632; BLOOMBERG TERMINAL</span>
        <span class="nav-item">EQUITIES</span>
        <span class="nav-item">FOREX</span>
        <span class="nav-item">NEWS</span>
        <span class="nav-item">PORTFOLIO</span>
        <span style="margin-left: auto;" class="timestamp" id="clock"></span>
    </nav>
    {% block content %}{% endblock %}
    <script>
        function updateClock() {
            const now = new Date();
            document.getElementById('clock').textContent =
                now.toLocaleTimeString('en-US', {hour12: false}) + ' ' +
                now.toLocaleDateString('en-US', {month: 'short', day: '2-digit', year: 'numeric'}).toUpperCase();
        }
        updateClock(); setInterval(updateClock, 1000);
    </script>
</body>
</html>
